<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/homepage/assets/css/cornell.css">
</head>
<body>
  <h1>{{ page.title }}</h1>
  <div class="cornell-note">
    <div class="cue">
      {{ page.cue | markdownify }}
    </div>
    <div class="notes">
      {{ content }}
    </div>
    <div class="summary">
      {{ page.summary | markdownify }}
    </div>
  </div>
</body>
</html>
